<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cherry Kins</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=19.01" />
  </head>
  <body>
    <main class="landing">
      <div class="landing-card">
        <div class="landing-logo">
          <img src="assets/ui/cherrykinslogo.png" alt="Cherry Kins" />
        </div>
        <p class="landing-sub">Enter your name to play</p>
        <p class="hint" style="margin-bottom: 1rem">v19.01</p>

        <form class="access-form" id="access-form" autocomplete="off">
          <input
            id="access-code"
            type="text"
            placeholder="your name"
            maxlength="24"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            autofocus
          />
          <button type="submit">Enter</button>
        </form>
        <p class="hint access-error" id="access-error" hidden>Enter a name.</p>
        <p class="credit">coded by disorderdev</p>
      </div>
    </main>

    <script>
      (function () {
        function adminKey(value) {
          try {
            return String(value || "")
              .trim()
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .replace(/[^a-z]/g, "");
          } catch (err) {
            return String(value || "")
              .trim()
              .toLowerCase()
              .replace(/[^a-z]/g, "");
          }
        }

        function displayName(value) {
          return String(value || "")
            .trim()
            .replace(/\s+/g, " ")
            .slice(0, 24);
        }

        var form = document.getElementById("access-form");
        var input = document.getElementById("access-code");
        var error = document.getElementById("access-error");

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var name = displayName(input.value);
          if (!name) {
            error.hidden = false;
            error.textContent = "Enter a name.";
            input.focus();
            return;
          }
          if (adminKey(name) === "hiperboles") {
            sessionStorage.setItem("cherrykins_role", "admin");
            sessionStorage.removeItem("cherrykins_player_name");
            location.href = "admin.html";
            return;
          }
          sessionStorage.setItem("cherrykins_role", "player");
          sessionStorage.setItem("cherrykins_player_name", name);
          location.href = "player.html";
        });

        input.addEventListener("input", function () {
          error.hidden = true;
        });
      })();
    </script>
  </body>
</html>
