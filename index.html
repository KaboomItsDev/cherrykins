<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cherry Kins</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=16" />
  </head>
  <body>
    <main class="landing">
      <div class="landing-card">
        <div class="landing-logo">
          <img src="assets/ui/cherrykinslogo.png" alt="Cherry Kins" />
        </div>
        <p class="landing-sub">Enter your access code</p>
        <p class="hint" style="margin-bottom: 1rem">build v16</p>

        <form class="access-form" id="access-form" autocomplete="off">
          <input
            id="access-code"
            type="text"
            placeholder="access code"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            autofocus
          />
          <button type="submit">Enter</button>
        </form>
        <p class="hint access-error" id="access-error" hidden>Wrong code.</p>
      </div>
    </main>

    <script>
      (function () {
        var CODES = {
          falacias: "player.html",
          hiperboles: "admin.html",
        };
        var ROLES = {
          falacias: "player",
          hiperboles: "admin",
        };

        function clean(value) {
          try {
            return String(value || "")
              .trim()
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .replace(/[^a-z]/g, "");
          } catch (err) {
            return String(value || "")
              .trim()
              .toLowerCase()
              .replace(/[^a-z]/g, "");
          }
        }

        var form = document.getElementById("access-form");
        var input = document.getElementById("access-code");
        var error = document.getElementById("access-error");

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var key = clean(input.value);
          if (!CODES[key]) {
            error.hidden = false;
            error.textContent = "Wrong code.";
            input.select();
            return;
          }
          sessionStorage.setItem("cherrykins_role", ROLES[key]);
          location.href = CODES[key];
        });

        input.addEventListener("input", function () {
          error.hidden = true;
        });
      })();
    </script>
  </body>
</html>
