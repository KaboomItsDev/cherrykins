<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cherry Kins — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=15" />
  </head>
  <body>
    <div class="admin">
      <aside class="admin-rail">
        <h1>Admin Panel <span style="color:var(--muted);font-size:0.7rem">v15</span></h1>
        <div class="room-box">
          <div class="meta">Sync code — Player types this (4 letters)</div>
          <div class="code" id="room-code">····</div>
          <div class="meta" id="room-status">Starting…</div>
        </div>

        <div>
          <h2>Character</h2>
          <div class="char-pick" id="char-pick"></div>
          <div class="btn-row" style="margin-top: 0.55rem">
            <button class="btn primary" id="btn-enter" type="button">Slide in</button>
            <button class="btn" id="btn-exit" type="button">Slide out</button>
          </div>
        </div>

        <div>
          <h2>Expression</h2>
          <div class="expr-grid" id="expr-grid"></div>
        </div>

        <div>
          <h2>Hearts</h2>
          <div class="stat-row">
            <button class="btn" id="heart-minus" type="button" title="Lose a heart">−</button>
            <input id="hearts" type="number" min="0" max="3" value="3" readonly />
            <button class="btn" id="heart-plus" type="button" title="Add a heart">+</button>
          </div>
          <p class="hint" style="margin-top: 0.35rem">− plays heart-lose sound</p>
        </div>

        <div>
          <h2>Tix / Money</h2>
          <div class="field">
            <label>Current tix</label>
            <input id="tix" type="number" min="0" value="0" readonly />
          </div>
          <div class="stat-row money-add-row">
            <input
              id="money-amount"
              type="number"
              min="1"
              step="1"
              placeholder="amount"
              value=""
            />
            <button class="btn primary" id="money-add" type="button" title="Add to player tix">+</button>
          </div>
          <p class="hint" style="margin-top: 0.35rem">Type amount, hit + — ching + popup on player</p>
        </div>

        <div>
          <h2>Clock</h2>
          <div class="field">
            <input id="clock" type="text" value="0X:XX" maxlength="8" />
          </div>
        </div>

        <p class="hint"><a href="index.html">← Home</a> · Keys 1–6 expr · I in · O out</p>
      </aside>

      <main class="admin-main">
        <h2>Live player view</h2>
        <div class="admin-preview" id="admin-preview">
          <div class="preview-stage">
            <div class="stage">
              <div class="scene" aria-hidden="true" id="admin-scene">
                <img class="scene-layer layer-rootbg" src="assets/ui/rootbg.png" alt="" />
                <img class="scene-layer layer-floor" src="assets/ui/floor.png" alt="" />
                <img class="scene-layer layer-bgtables" src="assets/ui/bgtables.png" alt="" />
                <img class="scene-layer layer-spotlights" src="assets/ui/spotlights.png" alt="" />
                <img class="scene-layer layer-light light-a" src="assets/ui/light01.png" alt="" />
                <img class="scene-layer layer-light light-b" src="assets/ui/light02.png" alt="" />
                <img class="scene-layer layer-balconyseats" src="assets/ui/balconyseats.png" alt="" />
                <img class="scene-layer layer-undertable" src="assets/ui/undertable.png" alt="" />
                <img class="scene-layer layer-table" src="assets/ui/table.png" alt="" />
              </div>
              <div class="character" id="preview-character">
                <div class="body" id="preview-body"></div>
              </div>
            </div>
          </div>
          <div class="preview-bar">
            <div class="tablet" aria-hidden="true"></div>
            <span class="preview-label">Player screen preview</span>
          </div>
        </div>
      </main>
    </div>

    <script>
      if (sessionStorage.getItem("cherrykins_role") !== "admin") {
        location.replace("index.html");
      }
    </script>
    <script src="js/recipes.js?v=15"></script>
    <script src="js/sync.js?v=15"></script>
    <script src="js/bystanders.js?v=15"></script>
    <script src="js/admin.js?v=15"></script>
  </body>
</html>
