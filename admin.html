<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cherry Kins — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=4" />
  </head>
  <body>
    <div class="admin">
      <aside class="admin-rail">
        <h1>Admin Panel <span style="color:var(--muted);font-size:0.7rem">v4</span></h1>
        <div class="room-box">
          <div class="meta">Sync code — Player types this (4 letters)</div>
          <div class="code" id="room-code">····</div>
          <div class="meta" id="room-status">Starting…</div>
        </div>

        <div>
          <h2>Character</h2>
          <div class="char-pick" id="char-pick"></div>
          <div class="btn-row" style="margin-top: 0.55rem">
            <button class="btn primary" id="btn-enter" type="button">Slide in</button>
            <button class="btn" id="btn-exit" type="button">Slide out</button>
          </div>
        </div>

        <div>
          <h2>Expression</h2>
          <div class="expr-grid" id="expr-grid"></div>
        </div>

        <div>
          <h2>Dialogue</h2>
          <div class="field">
            <textarea id="dialogue" placeholder="What they're saying…"></textarea>
          </div>
          <div class="btn-row">
            <button class="btn primary" id="btn-say" type="button">Send line</button>
            <button class="btn" id="btn-clear-line" type="button">Clear</button>
          </div>
        </div>

        <div>
          <h2>Stats</h2>
          <div class="field">
            <label for="hearts">Hearts (0–3)</label>
            <input id="hearts" type="number" min="0" max="3" value="3" />
          </div>
          <div class="field">
            <label for="tix">Tix</label>
            <input id="tix" type="number" min="0" value="0" />
          </div>
          <div class="field">
            <label for="clock">Clock</label>
            <input id="clock" type="text" value="0X:XX" maxlength="8" />
          </div>
        </div>

        <p class="hint"><a href="index.html">← Home</a> · Keys 1–5 expr · I in · O out</p>
      </aside>

      <main class="admin-main">
        <h2>Live player view</h2>
        <div class="admin-preview" id="admin-preview">
          <div class="preview-stage">
            <div class="crowd" aria-hidden="true"></div>
            <div class="character" id="preview-character">
              <div class="body" id="preview-body"></div>
            </div>
            <div class="dialogue" id="preview-dialogue"></div>
          </div>
          <div class="preview-bar">
            <div class="tablet" aria-hidden="true"></div>
            <span class="preview-label">Player screen preview</span>
          </div>
        </div>
      </main>
    </div>

    <script>
      if (sessionStorage.getItem("cherrykins_role") !== "admin") {
        location.replace("index.html");
      }
    </script>
    <script src="js/recipes.js?v=4"></script>
    <script src="js/sync.js?v=4"></script>
    <script src="js/admin.js?v=4"></script>
  </body>
</html>
