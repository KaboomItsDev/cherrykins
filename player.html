<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cherry Kins — Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=18" />
  </head>
  <body class="player-page">
    <div id="join-gate" class="landing">
      <div class="landing-card">
        <div class="landing-logo">
          <img src="assets/ui/cherrykinslogo.png" alt="Cherry Kins" />
        </div>
        <p class="landing-sub">Enter the <strong>4-letter sync code</strong> from Admin</p>
        <p class="hint" style="margin-bottom: 0.75rem">build v18</p>
        <div class="join-row">
          <input
            id="join-code"
            maxlength="4"
            placeholder="CODE"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            inputmode="text"
          />
          <button type="button" id="join-btn">Join</button>
        </div>
        <p class="hint" id="join-error"></p>
        <p class="hint"><a href="index.html">← Back</a></p>
      </div>
    </div>

    <div class="game-frame" id="game-frame">
      <div id="game" class="game" style="display: none">
        <header class="header">
          <div class="brand">
            <img src="assets/ui/cherrykinslogo.png" alt="Cherry Kins" />
          </div>
          <div class="clock" id="clock">0X:XX</div>
        </header>

        <aside class="side">
          <div class="errors-panel">
            <div class="errors-label">Errors</div>
            <div class="errors-box" id="errors-log"></div>
          </div>
          <div class="hearts" id="hearts" aria-label="Hearts"></div>
          <div class="tix-wrap">
            <div class="tix-label">Tix</div>
            <div class="tix-box">
              <span class="value" id="tix">0</span>
              <span class="tix-float" id="tix-float" hidden></span>
            </div>
          </div>
        </aside>

        <div class="stage-wrap">
          <div class="stage" id="stage">
            <div class="scene" aria-hidden="true" id="scene">
              <img class="scene-layer layer-rootbg" src="assets/ui/rootbg.png" alt="" />
              <img class="scene-layer layer-floor" src="assets/ui/floor.png" alt="" />
              <img class="scene-layer layer-bgtables" src="assets/ui/bgtables.png" alt="" />
              <img class="scene-layer layer-spotlights" src="assets/ui/spotlights.png" alt="" />
              <img class="scene-layer layer-light light-a" src="assets/ui/light01.png" alt="" />
              <img class="scene-layer layer-light light-b" src="assets/ui/light02.png" alt="" />
              <img class="scene-layer layer-balconyseats" src="assets/ui/balconyseats.png" alt="" />
              <img class="scene-layer layer-undertable" src="assets/ui/undertable.png" alt="" />
              <img class="scene-layer layer-table" src="assets/ui/table.png" alt="" />
            </div>

            <div class="character" id="character">
              <div class="body" id="character-body"></div>
            </div>

            <!-- Table props: opposite ends -->
            <button type="button" class="craft-prop craft-bell" id="craft-bell" title="Ring">
              <img src="assets/ui/bell.png" alt="Bell" />
            </button>
            <button type="button" class="craft-prop craft-menu" id="craft-menu" title="Menu">
              <img src="assets/ui/menu.png" alt="Menu" />
            </button>

            <!-- Undertable craft -->
            <div class="craft-bay">
              <img
                id="craft-ice"
                class="craft-ice"
                src="assets/ui/ice.png"
                data-src="assets/ui/ice.png"
                data-hover="assets/ui/ice_hover.png"
                alt="Ice"
                draggable="false"
              />
              <div class="craft-shaker-wrap">
                <img
                  id="craft-shaker"
                  class="craft-shaker"
                  src="assets/ui/shaker.png"
                  data-src="assets/ui/shaker.png"
                  data-hover="assets/ui/shaker_hover.png"
                  alt="Shaker"
                  draggable="false"
                />
                <div class="shaker-tip" id="shaker-tip"><em>empty</em></div>
              </div>
              <div class="craft-bottles" id="craft-bottles">
                <button type="button" class="craft-bottle" data-ing="ade" title="Adelhyde">
                  <img src="assets/ingredients/Adelhyde.png" alt="Adelhyde" draggable="false" />
                </button>
                <button type="button" class="craft-bottle" data-ing="bron" title="Bronson Extract">
                  <img src="assets/ingredients/Bronson_Extract.png" alt="Bronson" draggable="false" />
                </button>
                <button type="button" class="craft-bottle" data-ing="flan" title="Flanergide">
                  <img src="assets/ingredients/Flanergide.png" alt="Flanergide" draggable="false" />
                </button>
                <button type="button" class="craft-bottle" data-ing="powd" title="Powdered Delta">
                  <img src="assets/ingredients/Powdered_Delta.png" alt="Powdered Delta" draggable="false" />
                </button>
                <button type="button" class="craft-bottle" data-ing="karmo" title="Karmotrine">
                  <img src="assets/ingredients/Karmotrine.png" alt="Karmotrine" draggable="false" />
                </button>
              </div>
            </div>

            <!-- Menu pull-up -->
            <div class="menu-panel" id="menu-panel" aria-hidden="true">
              <img class="menu-panel-bg" src="assets/ui/menu_up.png" alt="" />
              <button type="button" class="menu-close" id="menu-close">Close</button>
              <div class="menu-recipe-list" id="menu-recipe-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      if (sessionStorage.getItem("cherrykins_role") !== "player") {
        location.replace("index.html");
      }
    </script>
    <script src="js/recipes.js?v=18"></script>
    <script src="js/sync.js?v=18"></script>
    <script src="js/bystanders.js?v=18"></script>
    <script src="js/craft.js?v=18"></script>
    <script src="js/player.js?v=18"></script>
  </body>
</html>
