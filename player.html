<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cherry Kins — Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=13" />
  </head>
  <body class="player-page">
    <div id="join-gate" class="landing">
      <div class="landing-card">
        <div class="landing-logo">Cherry Kins</div>
        <p class="landing-sub">Enter the <strong>4-letter sync code</strong> from Admin</p>
        <p class="hint" style="margin-bottom: 0.75rem">build v13</p>
        <div class="join-row">
          <input
            id="join-code"
            maxlength="4"
            placeholder="CODE"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            inputmode="text"
          />
          <button type="button" id="join-btn">Join</button>
        </div>
        <p class="hint" id="join-error"></p>
        <p class="hint"><a href="index.html">← Back</a></p>
      </div>
    </div>

    <div class="game-frame" id="game-frame">
      <div id="game" class="game" style="display: none">
        <header class="header">
          <div class="brand">Cherry Kins <span class="cherry" aria-hidden="true"></span></div>
          <div class="clock" id="clock">0X:XX</div>
        </header>

        <aside class="side">
          <div class="mugshot-wrap">
            <div class="mugshot" id="mugshot">
              <div class="placeholder" id="mug-placeholder">Mug shot</div>
              <img id="mug-img" alt="" hidden />
            </div>
            <div class="mug-name" id="mug-name"></div>
          </div>
          <div class="hearts" id="hearts" aria-label="Hearts"></div>
          <div class="tix-wrap">
            <div class="tix-label">Tix</div>
            <div class="tix-box">
              <span class="value" id="tix">0</span>
              <span class="tix-float" id="tix-float" hidden></span>
            </div>
          </div>
        </aside>

        <div class="stage-wrap">
          <div class="stage">
            <div class="scene" aria-hidden="true" id="scene">
              <img class="scene-layer layer-rootbg" src="assets/ui/rootbg.png" alt="" />
              <img class="scene-layer layer-floor" src="assets/ui/floor.png" alt="" />
              <img class="scene-layer layer-bgtables" src="assets/ui/bgtables.png" alt="" />
              <img class="scene-layer layer-spotlights" src="assets/ui/spotlights.png" alt="" />
              <img class="scene-layer layer-light light-a" src="assets/ui/light01.png" alt="" />
              <img class="scene-layer layer-light light-b" src="assets/ui/light02.png" alt="" />
              <img class="scene-layer layer-balconyseats" src="assets/ui/balconyseats.png" alt="" />
              <img class="scene-layer layer-undertable" src="assets/ui/undertable.png" alt="" />
              <img class="scene-layer layer-table" src="assets/ui/table.png" alt="" />
            </div>
            <div class="character" id="character">
              <div class="body" id="character-body"></div>
            </div>
            <div class="bar">
              <button
                class="menu-arrow"
                id="menu-arrow"
                type="button"
                title="Open recipes"
                aria-label="Open drink recipes"
              >
                <svg viewBox="0 0 36 28" fill="currentColor" aria-hidden="true">
                  <path d="M18 26 L2 4 H34 Z" />
                </svg>
              </button>
              <button class="tablet" id="tablet" type="button" title="Recipes" aria-label="Recipes tablet"></button>
            </div>
          </div>

          <div class="recipes" id="recipes" aria-hidden="true">
            <div class="recipes-head">
              <h2>RECIPES</h2>
              <button class="recipes-close" id="recipes-close" type="button">Close</button>
            </div>
            <div class="recipe-list" id="recipe-list"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      if (sessionStorage.getItem("cherrykins_role") !== "player") {
        location.replace("index.html");
      }
    </script>
    <script src="js/recipes.js?v=13"></script>
    <script src="js/sync.js?v=13"></script>
    <script src="js/bystanders.js?v=13"></script>
    <script src="js/player.js?v=13"></script>
  </body>
</html>
